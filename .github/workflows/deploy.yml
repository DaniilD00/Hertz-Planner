# Builds the GitHub Pages version of the map and keeps its trips up to date.
# See "Live version" in README.md.
name: Update the map

on:
  schedule:
    - cron: '*/10 * * * *' # GitHub often starts scheduled runs a few minutes late
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One update at a time; a newer one waits instead of cancelling a publish halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site (no server)
        run: npm run build:pages

      # Addresses, road shapes and each site's last good answer, kept between runs
      - name: Restore saved lookups
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: map-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: map-cache-

      # Exits with an error if no site answered and nothing was saved, so the live map stays as it is
      - name: Fetch the trips
        run: node scripts/snapshot.mjs dist/data

      - name: Save lookups for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cache
          key: map-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
